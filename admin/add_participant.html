<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление участника | ОСА</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Добавить нового участника</h1>
            <a href="participants.html" class="back-link">← Назад к списку</a>
        </header>

        <form id="addParticipantForm" class="participant-form">
            <div class="form-group">
                <label for="last_name">Фамилия*</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>

            <div class="form-group">
                <label for="first_name">Имя*</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>

            <div class="form-group">
                <label for="birth_date">Дата рождения*</label>
                <input type="date" id="birth_date" name="birth_date" required>
            </div>

            <div class="form-group">
                <label for="gender">Пол*</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Выберите пол</option>
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                </select>
            </div>

            <div class="form-group">
                <label for="weight_category">Весовая категория (кг)*</label>
                <input type="number" id="weight_category" name="weight_category" min="40" max="150" required>
            </div>

            <div class="form-group">
                <label for="contact_phone">Телефон*</label>
                <input type="tel" id="contact_phone" name="contact_phone" placeholder="+7 (XXX) XXX-XX-XX" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Добавить участника</button>
                <div id="form-message" class="message"></div>
            </div>
        </form>
    </div>

    <script src="../js/add_participant.js"></script>
</body>
</html>
